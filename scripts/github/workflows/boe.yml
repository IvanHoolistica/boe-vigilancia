name: BOE diario
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "AAAAMMDD (vacío = hoy)"
        required: false
permissions:
  contents: write
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/boe_digest.py ${{ github.event.inputs.fecha }}
      - name: Guardar resultado
        run: |
          git config user.name "boe-bot"
          git config user.email "boe-bot@users.noreply.github.com"
          git add digest
          git diff --cached --quiet || git commit -m "Sumario BOE $(date -u +%Y-%m-%d)"
          git push
